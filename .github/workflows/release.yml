name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: windows
            goarch: 386
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          # 全平台发裸二进制, Windows 补 .exe 后缀
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -trimpath -ldflags "-s -w" -o limit-${{ matrix.goos }}-${{ matrix.goarch }}.exe .
          else
            go build -trimpath -ldflags "-s -w" -o limit-${{ matrix.goos }}-${{ matrix.goarch }} .
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$TAG" limit-${{ matrix.goos }}-${{ matrix.goarch }}* --clobber
